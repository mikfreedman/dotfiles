# Mouse support: wheel scrolls tmux's scrollback (entering copy mode) instead of
# the terminal sending arrow keys to the shell, plus click to pick panes and drag
# to resize them.
set -g mouse on

# Colours: tmux's default TERM is "screen" (8 colours) and it hides the outer terminal's
# true colour, so vim/nvim fall back to cterm colours and base16 schemes come out wrong or
# not at all. Advertise 256 colours and RGB inside tmux; tmux downsamples RGB itself for
# outer terminals that lack it. COLORTERM is what core.vim checks before termguicolors.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB,*-direct:RGB'
set-environment -g COLORTERM truecolor
