# Package lists used by the run_onchange_before_10-packages-* scripts.
# Editing a list re-runs the matching script on the next `chezmoi apply`.
packages:
  darwin:
    # Installed everywhere (including --server style machines)
    brew_common: [chezmoi, git, vim, ripgrep, fd, fzf, mise, zoxide, starship, eza, atuin]
    brew: [go, node, zsh, direnv, corepack, wget, tmux, tcptraceroute, jq, bat, git-delta, claude, neovim, tree-sitter-cli, docker/tap/sbx]
    # Removed before installing: corepack provides yarn and conflicts with the yarn formula
    brew_remove: [yarn]
    casks: [firefox, google-chrome, bitwarden, bartender, veracrypt, spotify, zoom, neovide-app, docker-desktop, hammerspoon, alfred, flycut, rectangle, caffeine, git-credential-manager, iterm2, visual-studio-code, font-blex-mono-nerd-font]
  linux:
    apt_common: [git, curl, vim, ripgrep, fd-find, fzf, build-essential, unzip, xz-utils]
    apt: [tmux, zsh, net-tools, unattended-upgrades, software-properties-common, direnv, jq, bat]
    # Installed everywhere with mise (`mise use -g`), since apt's versions are old or missing
    mise: [zoxide, starship, eza, atuin]

# Pinned versions for Linux installs (macOS uses whatever Homebrew has)
versions:
  mise: v2026.11.0
  nvim: v0.12.6
  tree_sitter: v0.27.1
  nerd_fonts: v3.5.1
