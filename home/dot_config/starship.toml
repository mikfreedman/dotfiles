# Starship prompt (https://starship.rs/config/). One line, modelled on Prezto's old sorin theme:
#   ~/p/dotfiles ❯❯❯                                       main ⬆ ✚ ✱ ◼
# Over SSH it starts with user@host. The right side shows a failed exit status, then git.
# Symbols come from the Nerd Font Symbols preset (`starship preset nerd-font-symbols`),
# which needs a Nerd Font (BlexMono Nerd Font in Ghostty/Neovide/gvim).
"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
$username\
$hostname\
$directory\
$character"""

right_format = """
$status\
$git_branch\
$git_state\
$git_status"""

[username]
format = "[$user](bright-red)"

# SSH only (the default)
[hostname]
format = "[@](white)[$ssh_symbol$hostname](yellow) "
ssh_symbol = " "

# Every directory but the last cut to one letter: ~/p/dotfiles
[directory]
style = "blue"
truncation_length = 1
fish_style_pwd_dir_length = 1
truncate_to_repo = false
read_only = " 󰌾"

[character]
success_symbol = "[❯](bold red)[❯](bold yellow)[❯](bold green)"
error_symbol = "[❯](bold red)[❯](bold yellow)[❯](bold green)"
vimcmd_symbol = "[❮](bold green)[❮](bold yellow)[❮](bold red)"

[status]
disabled = false
format = "[$symbol]($style)"
symbol = " "
style = "red"

[git_branch]
format = " [$symbol$branch]($style)"
symbol = " "
style = "green"

[git_state]
format = "[ :](white)[$state]($style)"
style = "bright-red"

[git_status]
format = "$ahead_behind$staged$deleted$modified$renamed$stashed$conflicted$untracked"
ahead = "[ ⬆](bright-purple)"
behind = "[ ⬇](bright-purple)"
diverged = "[ ⬆⬇](bright-purple)"
staged = "[ ✚](green)"
deleted = "[ ✖](red)"
modified = "[ ✱](blue)"
renamed = "[ ➜](purple)"
stashed = "[ ✭](cyan)"
conflicted = "[ ═](yellow)"
untracked = "[ ◼](white)"

